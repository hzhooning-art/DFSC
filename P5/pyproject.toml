[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p5-memory-protocol"
version = "0.1.0"
description = "Auditable shared-memory identification and refusal protocol"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["matplotlib", "openpyxl", "torch"]

[project.scripts]
p5-memory-protocol = "p5_memory_protocol.cli:main"

[tool.setuptools]
packages = ["p5_memory_protocol"]
