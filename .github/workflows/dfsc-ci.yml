name: dfsc CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run installed-package smoke test
        run: python -c "import dfsc; print(dfsc.__version__); print(dfsc.smoke_test())"

  distribution:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install wheel outside the source tree
        shell: bash
        run: |
          python -m venv /tmp/dfsc-wheel
          /tmp/dfsc-wheel/bin/python -m pip install --upgrade pip
          /tmp/dfsc-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/dfsc-wheel/bin/python -c "import dfsc; print(dfsc.__version__); print(dfsc.smoke_test())"

      - name: Upload release candidates
        uses: actions/upload-artifact@v5
        with:
          name: dfsc-distributions
          path: dist/

  documentation:
    name: Strict documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build documentation
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
          python -m mkdocs build --strict

