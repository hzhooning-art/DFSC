[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfsc-primitive-protocol"
version = "0.1.0"
description = "Backend-independent reliability protocol for differentiable scientific-computing primitives"
readme = "dfsc_protocol/README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["dfsc_protocol*"]
