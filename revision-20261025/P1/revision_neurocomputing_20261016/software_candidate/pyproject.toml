[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfsc-revision-candidate"
version = "0.1.1.dev0"
description = "Local opt-in admission candidate for DFSC major revision; not a public release"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.11,<2.12", "numpy", "matplotlib", "mpmath"]

[tool.setuptools.packages.find]
where = ["src"]
