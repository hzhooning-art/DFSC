[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfsc-cpu-repair-candidate"
version = "0.1.0.dev0"
description = "Optional bounded CPU repair backend for DFSC revision; local development candidate"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.11,<2.12", "mpmath==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
